
<header class="topbar">

  <!-- ========================================= -->
  <!-- CONNECT LOGO AND SIDEBAR TOGGLE -->
  <!-- ========================================= -->

  <div class="brand-area">

    <!-- SAME CONNECT LOGO FOR ALL PROJECTS -->

    <button
      type="button"
      class="brand brand-button"
      [attr.aria-label]="
        projectStore.selectedProject().label + ' home'
      "
      (click)="navigateHome()"
    >

      <img
        src="/images/connect-logo.png"
        alt="CONNECT"
      />

    </button>

    <!-- SIDEBAR TOGGLE -->

    <button
      type="button"
      class="icon-btn menu-btn"
      [attr.aria-expanded]="menuOpen"
      aria-controls="main-sidebar"
      aria-label="Toggle sidebar"
      (click)="toggleSidebar()"
    >

      <i
        class="pi pi-bars"
        aria-hidden="true"
      ></i>

    </button>

  </div>

  <!-- ========================================= -->
  <!-- TOPBAR RIGHT SECTION -->
  <!-- ========================================= -->

  <div class="topbar-right">

    <!-- ========================================= -->
    <!-- SEARCH -->
    <!-- ========================================= -->

    <div class="search">

      <i
        class="pi pi-search"
        aria-hidden="true"
      ></i>

      <input
        type="search"
        aria-label="Search workspace"
        placeholder="Search here..."
        [value]="query()"
        (input)="query.set($any($event.target).value)"
      />

    </div>

    <!-- ========================================= -->
    <!-- NOTIFICATIONS -->
    <!-- ========================================= -->

    <button
      type="button"
      class="icon-btn notification"
      aria-label="Notifications"
      title="Notifications"
    >

      <i
        class="pi pi-bell"
        aria-hidden="true"
      ></i>

      <span
        class="dot"
        aria-hidden="true"
      ></span>

    </button>

    <!-- ========================================= -->
    <!-- PROJECT SWITCH -->
    <!-- ========================================= -->

    <div class="project-switch">

      <!-- SWITCH TRIGGER -->

      <button
        type="button"
        class="switch-trigger"
        [class.switch-trigger-active]="switchOpen()"
        [attr.aria-expanded]="switchOpen()"
        aria-haspopup="true"
        aria-controls="project-switch-menu"
        (click)="toggleProjectSwitch()"
      >

        <span class="switch-icon">

          <i
            class="pi pi-sync"
            aria-hidden="true"
          ></i>

        </span>

        <span class="switch-label">
          Switch
        </span>

        <i
          class="pi"
          [class.pi-chevron-up]="switchOpen()"
          [class.pi-chevron-down]="!switchOpen()"
          aria-hidden="true"
        ></i>

      </button>

      <!-- ========================================= -->
      <!-- PROJECT SWITCH POPUP -->
      <!-- ========================================= -->

      @if (switchOpen()) {

        <div
          id="project-switch-menu"
          class="switch-popup"
          role="group"
          aria-label="Switch project"
        >

          <!-- POPUP TITLE -->

          <div class="switch-popup-title">
            Switch Project
          </div>

          <!-- CURRENT PROJECT -->

          <div class="switch-current">

            <span>
              Current:
            </span>

            <strong>
              {{ projectStore.selectedProject().label }}
            </strong>

          </div>

          <div class="switch-popup-divider"></div>

          <!-- OTHER AVAILABLE PROJECTS -->

          @for (
            project of projectStore.otherProjects();
            track project.id
          ) {

            <button
              type="button"
              class="switch-project-item"
              (click)="selectProject(project.id)"
            >

              <i
                [class]="project.icon"
                aria-hidden="true"
              ></i>

              <span>
                {{ project.label }}
              </span>

              <i
                class="pi pi-angle-right switch-arrow"
                aria-hidden="true"
              ></i>

            </button>

          }

        </div>

      }

    </div>

    <!-- ========================================= -->
    <!-- USER PROFILE -->
    <!-- ========================================= -->

    <div class="profile">

      <!-- PROFILE TRIGGER -->

      <button
        type="button"
        class="profile-trigger"
        [attr.aria-expanded]="profileOpen()"
        aria-haspopup="true"
        aria-controls="user-profile-menu"
        aria-label="User menu"
        (click)="toggleProfile()"
      >

        <span class="avatar">
          VA
        </span>

        <span class="profile-name">
          Veera
        </span>

        <i
          class="pi"
          [class.pi-angle-up]="profileOpen()"
          [class.pi-angle-down]="!profileOpen()"
          aria-hidden="true"
        ></i>

      </button>

      <!-- ========================================= -->
      <!-- PROFILE DROPDOWN -->
      <!-- ========================================= -->

      @if (profileOpen()) {

        <div
          id="user-profile-menu"
          class="profile-menu"
          role="group"
          aria-label="User options"
        >

          <!-- ========================================= -->
          <!-- PROJECT HOME -->
          <!-- ========================================= -->

          <button
            type="button"
            class="profile-menu-item"
            [class.profile-menu-active]="
              !routerIsSettings()
            "
            (click)="openProjectHome()"
          >

            <i
              class="pi pi-home profile-menu-icon"
              aria-hidden="true"
            ></i>

            <span class="profile-menu-text">
              Project Home
            </span>

          </button>

          <!-- ========================================= -->
          <!-- SETTINGS - CONNECT AND LEARN HUB -->
          <!-- ========================================= -->

          @if (supportsSettings()) {

            <button
              type="button"
              class="profile-menu-item"
              [class.profile-menu-active]="
                routerIsSettings()
              "
              (click)="openSettings()"
            >

              <i
                class="pi pi-cog profile-menu-icon"
                aria-hidden="true"
              ></i>

              <span class="profile-menu-text">
                Settings
              </span>

            </button>

          }

          <!-- ========================================= -->
          <!-- DIVIDER -->
          <!-- ========================================= -->

          <div class="profile-menu-divider"></div>

          <!-- ========================================= -->
          <!-- SIGN OUT -->
          <!-- ========================================= -->

          <button
            type="button"
            class="profile-menu-item"
            (click)="signOutDemo()"
          >

            <i
              class="pi pi-sign-out profile-menu-icon"
              aria-hidden="true"
            ></i>

            <span class="profile-menu-text">
              Sign out (demo)
            </span>

          </button>

        </div>

      }

    </div>

  </div>

</header>
